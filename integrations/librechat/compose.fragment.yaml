services:
  api:
    environment:
      PPTX_MCP_SHARED_SECRET: ${PPTX_MCP_SHARED_SECRET}
    networks:
      - default
      - pptx-mcp

  pptx-mcp:
    image: pptx-mcp:local
    environment:
      PptxMcp__SharedSecret: ${PPTX_MCP_SHARED_SECRET}
      PptxMcp__SigningKey: ${PPTX_MCP_SIGNING_KEY}
      PptxMcp__PublicBaseUrl: ${PPTX_MCP_PUBLIC_BASE_URL}
      PptxMcp__StorageRoot: /data/pptx-mcp
      PptxMcp__LibreChatUploadsRoot: /data/librechat-uploads
    networks:
      - pptx-mcp
    ports:
      - "127.0.0.1:${PPTX_MCP_PORT:-18080}:8080"
    volumes:
      - pptx-mcp-data:/data/pptx-mcp
      - ./uploads:/data/librechat-uploads:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: ["ALL"]

networks:
  pptx-mcp:
    internal: true

volumes:
  pptx-mcp-data:
