services:
  api:
    depends_on:
      - pptx-mcp
    environment:
      PPTX_MCP_SHARED_SECRET: ${PPTX_MCP_SHARED_SECRET}
    networks:
      - default
      - pptx-mcp

  pptx-mcp:
    image: pptx-mcp:local
    environment:
      PptxMcp__SharedSecret: ${PPTX_MCP_SHARED_SECRET}
      PptxMcp__SigningKey: ${PPTX_MCP_SIGNING_KEY}
      PptxMcp__PublicBaseUrl: ${PPTX_MCP_PUBLIC_BASE_URL}
      PptxMcp__StorageRoot: /data/pptx-mcp
      PptxMcp__LibreChatUploadsRoot: /data/librechat-uploads
    networks:
      - pptx-mcp
    volumes:
      - pptx-mcp-data:/data/pptx-mcp
      - ./uploads:/data/librechat-uploads:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  pptx-artifact-proxy:
    image: nginx:alpine@sha256:d67ea0d64d518b1bb04acde3b00f722ac3e9764b3209a9b0a98924ba35e4b779
    depends_on:
      - pptx-mcp
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    networks:
      - pptx-mcp
      - pptx-public
    ports:
      - "${PPTX_MCP_PORT:-18080}:8080"
    volumes:
      - ${PPTX_MCP_NGINX_CONFIG_PATH:-./integrations/pptx-mcp/nginx.conf}:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  pptx-mcp:
    internal: true
  pptx-public:

volumes:
  pptx-mcp-data:
