services:
  pptx-mcp:
    image: pptx-mcp:local
    build:
      context: .
      target: runtime
    environment:
      PptxMcp__SharedSecret: ${PPTX_MCP_SHARED_SECRET:?set PPTX_MCP_SHARED_SECRET}
      PptxMcp__SigningKey: ${PPTX_MCP_SIGNING_KEY:?set PPTX_MCP_SIGNING_KEY}
      PptxMcp__PublicBaseUrl: ${PPTX_MCP_PUBLIC_BASE_URL:-http://localhost:18080}
      PptxMcp__StorageRoot: /data/pptx-mcp
      PptxMcp__LibreChatUploadsRoot: /data/librechat-uploads
      PptxMcp__TemplatesRoot: /data/pptx-templates
      PptxMcp__DefaultTemplateId: ${PPTX_MCP_DEFAULT_TEMPLATE_ID:-}
      PptxMcp__BrandProfilesRoot: /data/pptx-brand-profiles
      PptxMcp__RequireDesignBrief: ${PPTX_MCP_REQUIRE_DESIGN_BRIEF:-false}
      PptxMcp__FirstAssistantNotice: ${PPTX_MCP_FIRST_ASSISTANT_NOTICE:-}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - pptx-data:/data/pptx-mcp
      - ${LIBRECHAT_UPLOADS_PATH:?set LIBRECHAT_UPLOADS_PATH}:/data/librechat-uploads:ro
      - ${PPTX_MCP_TEMPLATES_PATH:-./templates}:/data/pptx-templates:ro
      - ${PPTX_MCP_BRAND_PROFILES_PATH:-./brand-profiles}:/data/pptx-brand-profiles:ro
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - pptx-internal

  pptx-codex-proxy:
    image: nginx:alpine@sha256:d67ea0d64d518b1bb04acde3b00f722ac3e9764b3209a9b0a98924ba35e4b779
    depends_on:
      pptx-mcp:
        condition: service_healthy
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    networks:
      - pptx-internal
      - pptx-local-ingress
    ports:
      - "127.0.0.1:${PPTX_MCP_PORT:-18080}:8080"
    volumes:
      - ./integrations/codex/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  pptx-data:

networks:
  pptx-internal:
    internal: true
  pptx-local-ingress:
